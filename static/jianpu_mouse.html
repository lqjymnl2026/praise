<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简谱框架打谱 · 赞美诗中心</title>
<style>
:root{--ink:#1c2740;--ink2:#5b6b85;--primary:#4b6eaf;--gold:#c9a227;--line:#e3e8f0;--bg:#f2f5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
.top{background:linear-gradient(135deg,#1e2942,#3a5791);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top h1{font-size:17px}
.top a{color:#ffd970;text-decoration:none;font-size:13px;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:8px}
.wrap{max-width:1400px;margin:0 auto;padding:14px;display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font-size:13px;margin-bottom:8px;color:var(--ink2);font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-green{background:#2e9e6b;color:#fff;border-color:#2e9e6b}
.btn:hover{opacity:.9}
.tb-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tb-row .lb{font-size:11px;color:var(--ink2);margin-right:2px;min-width:34px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.meta input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;width:100%}
.hint{font-size:11px;color:var(--ink2);line-height:1.8}
.hint b{color:var(--primary)}
.mt8{margin-top:8px}
.fw-sys .mel-input{font-size:14px;min-height:44px;font-family:ui-monospace,Menlo,monospace}
.fw-lyr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.fw-lyr input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;width:100%}
.fw-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.fw-head .fw-num{font-size:12px;color:var(--ink2);font-weight:600}
#fwScore{overflow:auto;max-height:calc(100vh - 130px);min-height:70vh;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
#fwScore svg{max-width:100%}
textarea{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:60px;width:100%;outline:none;resize:vertical}
</style>
</head>
<body>
<div class="top">
  <h1>🎼 简谱框架打谱（按版面固定排版）</h1>
  <span>
    <a href="/jianpu">📝 文本编辑器</a>
    <a href="/#/collection">返回后台</a>
  </span>
</div>
<!-- ============ 框架编辑区（按版面框架分析：页眉 + 系统1-4） ============ -->
<div class="wrap" id="wrapFw">
  <div class="left">
    <div class="card">
      <h2>📋 页眉区（歌名大字 · 调号拍号 · 页码）</h2>
      <div class="meta">
        <input id="fwTitle" placeholder="歌名（大字，居中）" value="奇异恩典">
        <input id="fwKey" placeholder="调号 1=F" value="1=F">
        <input id="fwMeter" placeholder="拍号 4/4" value="4/4">
        <input id="fwAuthor" placeholder="作词" value="John Newton">
      </div>
      <div class="meta mt8">
        <input id="fwComposer" placeholder="作曲" value="NEW BRITAIN">
        <input id="fwPage" placeholder="页码（自动）" value="3">
        <button class="btn btn-gold" id="fwFill" style="grid-column:span 2">✨ 填入示例（须将心门敞开）</button>
      </div>
      <div class="hint mt8">旋律框输入：数字 1-7 · # 升号 · 0 休止 · | 小节线 · 空格分隔 · <b>-</b> 二分 <b>--</b> 全音符 <b>_</b> 八分 <b>__</b> 十六分 · <b>.</b> 附点 · <b>'</b>/<b>,</b> 高低八度</div>
    </div>

    <div class="card fw-sys">
      <div class="fw-head"><h2>🎼 系统1 · 正歌</h2><span class="fw-num">旋律 + 歌词4行</span></div>
      <textarea class="mel-input" placeholder="旋律：5 1 1 3# 3 4 3 4 1 5 6 5 3 3 4 1 5 6 5 5"></textarea>
      <div class="fw-lyr">
        <input placeholder="歌词1：有一位慈悲主站在你心门外">
        <input placeholder="歌词2：主离天庭降世为要彰显救恩">
        <input placeholder="歌词3：他是慈爱良善且有丰盛恩惠">
        <input placeholder="歌词4：他且要引导你到那安乐天城">
      </div>
    </div>

    <div class="card fw-sys">
      <div class="fw-head"><h2>🎼 系统2 · 正歌</h2><span class="fw-num">旋律 + 歌词4行</span></div>
      <textarea class="mel-input" placeholder="旋律：4 3 1 3 2 1 2 5 1 1 3# 2 3 4 3 4 1 5 6 5 3"></textarea>
      <div class="fw-lyr">
        <input placeholder="歌词1：为何让他离开？他屡次耐心呼召你">
        <input placeholder="歌词2：救世主和大君，在天父宝座前代求">
        <input placeholder="歌词3：为他安置宝座；他等待赐福安慰">
        <input placeholder="歌词4：的新耶路撒冷，那里永无黑夜">
      </div>
    </div>

    <div class="card fw-sys">
      <div class="fw-head"><h2>🎼 系统3 · 副歌</h2><span class="fw-num">旋律 + 副歌歌词×4</span></div>
      <textarea class="mel-input" placeholder="旋律：3 1 2 2 2 1 1 2 - 2 1 3 | 1 7 1 2 1 1 - 1 5 3 2 3 4 1 3"></textarea>
      <div class="fw-lyr">
        <input placeholder="副歌1：你须将心门敞开">
        <input placeholder="副歌2：你须将心门敞开">
        <input placeholder="副歌3：你须将心门敞开">
        <input placeholder="副歌4：你须将心门敞开">
      </div>
    </div>

    <div class="card fw-sys">
      <div class="fw-head"><h2>🎼 系统4 · 结束句</h2><span class="fw-num">旋律 + 歌词</span></div>
      <textarea class="mel-input" placeholder="旋律：5 1 6 6 4 9 6 1 5 5# 3 4 1 5 3 4 3 2 1 1 2"></textarea>
      <div class="fw-lyr" style="grid-template-columns:1fr">
        <input placeholder="歌词：让耶稣进来，救你脱离罪恶，你须将心门敞开">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🖼 框架谱面预览（所见即所得）</h2>
    <div id="fwScore"></div>
    <div class="tb-row mt8">
      <button class="btn btn-green" id="fwPlay">🔊 试听</button>
      <button class="btn" id="fwPng">PNG</button>
      <button class="btn" id="fwSvg">SVG</button>
      <button class="btn btn-gold" id="fwPdf">🖨 PDF</button>
      <button class="btn" id="fwClear">清空框架</button>
    </div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);

function svgToCanvas(svg) {
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const m = svg.match(/width="(\d+)" height="(\d+)"/);
      const w = Number(m?.[1] || 800), h = Number(m?.[2] || 400);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c);
    };
    img.src = url;
  });
}

// ============ 框架编辑区：按版面框架（页眉 + 系统1-4） ============
function parseMelody(txt) {
  const notes = [];
  const tokens = String(txt || "").split(/\s+/).filter(Boolean);
  for (const t of tokens) {
    if (t.startsWith("|") || t.startsWith(":")) continue;
    if (t.startsWith("0")) { notes.push({ pitch: 0, dur: 1, dot: false, oct: 0, tie: false, type: "r" }); continue; }
    const m = t.match(/^([1-7])(['',]*)(_*|-*)(\.?)(~?)$/);
    if (!m) continue;
    const oct = (m[2].match(/'/g) || []).length - (m[2].match(/,/g) || []).length;
    let dur = 1;
    if (m[3] === "__") dur = 0.25; else if (m[3] === "_") dur = 0.5;
    else if (m[3]) dur = m[3].length + 1;
    if (dur > 4) dur = 4;
    notes.push({ pitch: Number(m[1]), dur, dot: !!m[4], oct, tie: !!m[5], type: "n" });
  }
  return notes;
}
function fwSysCards() { return Array.from(document.querySelectorAll("#wrapFw .fw-sys")); }
function fwState() {
  const cards = fwSysCards();
  return {
    title: $("#fwTitle").value.trim() || "未命名",
    key: $("#fwKey").value.trim(),
    meter: $("#fwMeter").value.trim(),
    author: $("#fwAuthor").value.trim(),
    composer: $("#fwComposer").value.trim(),
    page: $("#fwPage").value.trim(),
    systems: cards.map(c => ({
      notes: parseMelody(c.querySelector(".mel-input").value),
      lyrics: Array.from(c.querySelectorAll(".fw-lyr input")).map(i => i.value.trim()).filter(Boolean)
    }))
  };
}
function renderFw() {
  const fw = fwState();
  const beatsPerBar = Number((fw.meter || "4/4").split("/")[1] || 4);
  const W = 30, H = 36, TOP = 96, LEFT = 60;
  const maxBars = 6, barW = beatsPerBar * W + 6;
  const contentW = maxBars * barW;
  const svgW = Math.max(820, LEFT + contentW + 40);
  // 每个系统块高度 = 标题 + 旋律区 + 歌词槽（按表单固定槽数，空也占位）
  const slots = fwSysCards().map(c => c.querySelectorAll(".fw-lyr input").length);
  let bodyH = 0;
  slots.forEach(n => { bodyH += 30 + 40 + n * 22 + 18; });
  const svgH = TOP + bodyH + 18;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="background:#fff">`;
  // ===== ① 页眉区 =====
  const keyTxt = fw.key + (fw.meter ? " " + fw.meter : "");
  if (keyTxt.trim()) svg += `<text x="20" y="30" font-size="15" fill="#333" font-weight="600">${keyTxt.trim()}</text>`;
  svg += `<text x="${svgW/2}" y="36" font-size="27" font-weight="bold" text-anchor="middle">${fw.title}</text>`;
  const sub = [fw.author, fw.composer].filter(Boolean).join(" · ");
  if (sub) svg += `<text x="${svgW/2}" y="56" font-size="12" text-anchor="middle" fill="#666">${sub}</text>`;
  if (fw.page) svg += `<text x="${svgW-20}" y="30" font-size="15" text-anchor="end" fill="#333">${fw.page}</text>`;
  svg += `<line x1="20" y1="72" x2="${svgW-20}" y2="72" stroke="#9aa5b5" stroke-width="1.2"/>`;

  // ===== ②-⑨ 系统区（固定骨架） =====
  const sysNames = ["系统1 · 正歌", "系统2 · 正歌", "系统3 · 副歌", "系统4 · 结束句"];
  let y = TOP;
  fw.systems.forEach((s, si) => {
    const nSlots = slots[si];
    const blockH = 30 + 40 + nSlots * 22 + 18;
    const ry = y;
    // 系统块背景 + 边框（模拟分析图的区块）
    svg += `<rect x="18" y="${ry}" width="${svgW-36}" height="${blockH}" rx="8" fill="${si===2 ? "#fbf6ec" : "#f6f8fc"}" stroke="${si===2 ? "#e5d5b0" : "#d9e1ec"}" stroke-width="1.2"/>`;
    // 系统标签（左上）
    svg += `<text x="28" y="${ry+18}" font-size="12" fill="#5b6b85" font-weight="700">${sysNames[si] || ("系统"+(si+1))}</text>`;
    // 旋律区骨架：基线 + 6 小节竖线
    const melY = ry + 34;
    const melX0 = LEFT, melX1 = LEFT + contentW;
    svg += `<line x1="${melX0}" y1="${melY}" x2="${melX1}" y2="${melY}" stroke="#b7c0ce" stroke-width="1"/>`;
    for (let b = 0; b <= maxBars; b++) {
      const bx = melX0 + b * barW;
      svg += `<line x1="${bx}" y1="${melY-7}" x2="${bx}" y2="${melY+7}" stroke="#b7c0ce" stroke-width="1"/>`;
    }
    // 旋律音符（有内容才画）
    let x = melX0, beats = 0, barIdx = 0;
    const allXs = [];
    s.notes.forEach((n, i) => {
      if (i > 0 && beats >= beatsPerBar - 0.001) { barIdx++; x = melX0 + Math.min(barIdx, maxBars) * barW; beats = 0; }
      const nx = x, ny = melY + 8;
      if (n.type === "r") {
        svg += `<text x="${nx}" y="${ny}" font-size="17" text-anchor="middle" fill="#333">0</text>`;
      } else {
        svg += `<text x="${nx}" y="${ny}" font-size="23" font-family="Georgia,serif" text-anchor="middle">${n.pitch}</text>`;
        for (let k = 0; k < Math.abs(n.oct); k++) {
          const cy = n.oct > 0 ? ny - 20 - k*6 : ny + 8 + k*6;
          svg += `<circle cx="${nx}" cy="${cy}" r="2"/>`;
        }
        if (n.dot) svg += `<circle cx="${nx + n.dur*W + 6}" cy="${ny}" r="2.5"/>`;
        if (n.tie) svg += `<path d="M ${nx+4} ${ny-4} Q ${nx+12} ${ny-14} ${nx+20} ${ny-4}" stroke="#000" fill="none" stroke-width="1.6"/>`;
        if (n.dur <= 0.5) svg += `<line x1="${nx-9}" y1="${ny+10}" x2="${nx+9}" y2="${ny+10}" stroke="#000" stroke-width="1.5"/>`;
        if (n.dur <= 0.25) svg += `<line x1="${nx-9}" y1="${ny+14}" x2="${nx+9}" y2="${ny+14}" stroke="#000" stroke-width="1.5"/>`;
        if (n.dur >= 2) svg += `<line x1="${nx+6}" y1="${ny}" x2="${nx+n.dur*W-6}" y2="${ny}" stroke="#000" stroke-width="2"/>`;
      }
      allXs.push(nx);
      x += n.dur * W + 6;
      beats += n.dur;
    });
    // 歌词槽（固定槽数，空槽画虚线占位）
    const lyrY0 = melY + 26;
    for (let lri = 0; lri < nSlots; lri++) {
      const ly = lyrY0 + lri * 22;
      const lr = s.lyrics[lri] || "";
      if (lr) {
        const chars = Array.from(lr);
        chars.forEach((c, ci) => {
          if (c === " " || c === "，" || c === "。") return;
          const nx = allXs[Math.min(ci, allXs.length - 1)] ?? melX0;
          svg += `<text x="${nx}" y="${ly}" font-size="13" text-anchor="middle">${c}</text>`;
        });
      } else {
        svg += `<line x1="${melX0}" y1="${ly}" x2="${melX0 + 64}" y2="${ly}" stroke="#e3e8f0" stroke-width="1" stroke-dasharray="4,3"/>`;
      }
    }
    // 区块间分隔线（仿分析图）
    svg += `<line x1="18" y1="${ry + blockH}" x2="${svgW-18}" y2="${ry + blockH}" stroke="#cdd6e2" stroke-width="1" stroke-dasharray="6,4"/>`;
    y += blockH;
  });
  svg += `</svg>`;
  $("#fwScore").innerHTML = svg;
}

function currentFwSvg() { return $("#fwScore").querySelector("svg").outerHTML; }
document.querySelectorAll("#wrapFw .mel-input, #wrapFw .fw-lyr input, #wrapFw input").forEach(el => el.addEventListener("input", renderFw));
$("#fwClear").addEventListener("click", () => {
  document.querySelectorAll("#wrapFw .mel-input").forEach(t => t.value = "");
  document.querySelectorAll("#wrapFw .fw-lyr input").forEach(i => i.value = "");
  renderFw();
});
$("#fwFill").addEventListener("click", () => {
  $("#fwTitle").value = "须将心门敞开";
  $("#fwKey").value = "1=F"; $("#fwMeter").value = "4/4"; $("#fwPage").value = "3";
  $("#fwAuthor").value = ""; $("#fwComposer").value = "";
  const mels = document.querySelectorAll("#wrapFw .mel-input");
  mels[0].value = "5 1 1 3# 3 4 3 4 1 5 6 5 3 3 4 1 5 6 5 5";
  mels[1].value = "4 3 1 3 2 1 2 5 1 1 3# 2 3 4 3 4 1 5 6 5 3";
  mels[2].value = "3 1 2 2 2 1 1 2 - 2 1 3 | 1 7 1 2 1 1 - 1 5 3 2 3 4 1 3";
  mels[3].value = "5 1 6 6 4 6 1 5 5# 3 4 1 5 3 4 3 2 1 1 2";
  const lyr = document.querySelectorAll("#wrapFw .fw-lyr input");
  lyr[0].value = "有一位慈悲主站在你心门外，他切望能进来";
  lyr[1].value = "主离天庭降世为要彰显救恩，他被称为耶稣";
  lyr[2].value = "他是慈爱良善且有丰盛恩惠，能把你心洁净";
  lyr[3].value = "他且要引导你到那安乐天城，就是上帝所建";
  lyr[4].value = "为何让他离开？他屡次耐心地用慈声呼召你";
  lyr[5].value = "救世主和大君，在天父宝座前时常代你恳求";
  lyr[6].value = "为他安置宝座；他等待要赐福，使你心得安慰";
  lyr[7].value = "的新耶路撒冷，那里永无黑夜，尘世历程已尽";
  lyr[8].value = "你须将心门敞开。须将心门敞开，须将心门敞开";
  lyr[9].value = "你须将心门敞开。";
  lyr[10].value = "你须将心门敞开。";
  lyr[11].value = "你须将心门敞开。";
  lyr[12].value = "让耶稣进来，救你脱离罪恶，你须将心门敞开";
  renderFw();
});
$("#fwPng").addEventListener("click", async () => {
  const c = await svgToCanvas(currentFwSvg());
  const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "简谱-框架排版.png"; a.click();
});
$("#fwSvg").addEventListener("click", () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([currentFwSvg()], { type: "image/svg+xml" })); a.download = "简谱-框架排版.svg"; a.click();
});
$("#fwPdf").addEventListener("click", () => {
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>简谱-框架排版</title><style>@page{size:A4;margin:15mm}body{font-family:'PingFang SC','Microsoft YaHei';margin:0}svg{width:100%;height:auto}</style></head><body>${currentFwSvg()}</body></html>`);
  win.document.close(); win.focus(); win.print();
});

// 框架谱面试听（按系统顺序播放）
function fwPlay() {
  const fw = fwState();
  const f = { 1: 523.25, 2: 587.33, 3: 659.25, 4: 698.46, 5: 783.99, 6: 880, 7: 987.77 };
  let ac = window.__fwAc;
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); window.__fwAc = ac; }
  if (ac.state === "suspended") ac.resume();
  let t = ac.currentTime + 0.1;
  fw.systems.forEach(s => s.notes.forEach(n => {
    if (n.type === "r") { t += n.dur * 0.5; return; }
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = (f[n.pitch] || 523.25) * Math.pow(2, n.oct);
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + n.dur * 0.5);
    o.start(t); o.stop(t + n.dur * 0.5 + 0.05);
    t += n.dur * 0.5;
  }));
}
$("#fwPlay").addEventListener("click", fwPlay);
renderFw();
</script>
</body>
</html>
